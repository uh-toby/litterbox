# Personal devcontainer compose overrides.
# See .devcontainer/compose.yaml for the base service config to extend.
services:
  rails-app:
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
      # Make the shared Secret Service available to non-interactive bk commands.
      BASH_ENV: /home/lyssna/.local/bin/keyring-init.sh
      # Fine-grained permissions pulled from the host Keychain by pi-worktree.local.sh.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      BUILDKITE_ORGANIZATION_SLUG: usabilityhub
    volumes:
      - ~/Documents/agent-notes:/home/lyssna/Documents/agent-notes
      - ~/.agents:/home/lyssna/.agents
      - ~/.agents/skills:/home/lyssna/.claude/skills
      - pi-agent:/home/lyssna/.pi/agent
      # Docker Desktop's host SSH-agent forwarding socket.
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
      # Use the host Pi credentials without copying them into the worktree.
      - type: bind
        source: ${HOME}/.pi/agent/auth.json
        target: /home/lyssna/.pi/agent/auth.json
        read_only: true
      # Shared across worktrees so OAuth sessions persist.
      - pup:/home/lyssna/.config/pup
      - buildkite-keyrings:/home/lyssna/.local/share/keyrings
      - buildkite-keyring-session:/home/lyssna/.local/share/keyring-session
      - sentry:/home/lyssna/.sentry

volumes:
  pi-agent:
  pup:
    external: true
    name: lyssna-pup
  buildkite-keyrings:
    external: true
    name: lyssna-buildkite-keyrings
  buildkite-keyring-session:
    external: true
    name: lyssna-buildkite-keyring-session
  sentry:
    external: true
    name: lyssna-sentry
