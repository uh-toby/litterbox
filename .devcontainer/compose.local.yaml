# Personal devcontainer compose overrides.
# See .devcontainer/compose.yaml for the base service config to extend.
services:
  rails-app:
    labels:
      lyssna.local_config_fingerprint: ${LOCAL_CONFIG_FINGERPRINT:-unknown}
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
      # The local post-start hook owns the fixed headless Secret Service socket.
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      # Fine-grained permissions pulled from the host Keychain by hub-workflow.local.sh.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      # A dedicated, read-only Buildkite API token. OAuth cannot redirect a host
      # browser to bk's loopback callback listener inside this container.
      BUILDKITE_API_TOKEN: ${BUILDKITE_API_TOKEN:-}
      # Pup uses the shared OAuth session in the Secret Service. Do not set
      # DD_API_KEY/DD_APP_KEY: they are legacy credentials and cause Pup to
      # fall back to an invalid API-key session when the keyring is unavailable.
      DD_SITE: datadoghq.com
      BUILDKITE_ORGANIZATION_SLUG: usabilityhub
    volumes:
      - ~/Documents/agent-notes:/home/lyssna/Documents/agent-notes
      # Agent configuration and skills are host-managed. Notes remain writable so
      # containers and the host can share handover and papercut records.
      - type: bind
        source: ~/.agents
        target: /home/lyssna/.agents
        read_only: true
      - type: bind
        source: ~/.agents/skills
        target: /home/lyssna/.claude/skills
        read_only: true
      # Share pnpm's content-addressable store between worktrees. node_modules
      # remains worktree-local through the base Compose configuration.
      - pnpm-store:/home/lyssna/.pnpm
      - pi-agent:/home/lyssna/.pi/agent
      # Docker Desktop's host SSH-agent forwarding socket.
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
      # Use the host Pi credentials without copying them into the worktree.
      - type: bind
        source: ${HOME}/.pi/agent/auth.json
        target: /home/lyssna/.pi/agent/auth.json
        read_only: true
      # Sessions are durable on the host and available to all newly created
      # worktree containers. Pi still organises them by each environment's cwd.
      - type: bind
        source: ${HOME}/.pi/agent/sessions
        target: /home/lyssna/.pi/agent/sessions
      # The host is the source of truth for global Pi configuration and its
      # appended system prompt. Pi writes harmless global metadata such as its
      # last changelog version, so settings.json must remain writable.
      - type: bind
        source: ${HOME}/.pi/agent/settings.json
        target: /home/lyssna/.pi/agent/settings.json
      - type: bind
        source: ${HOME}/.pi/agent/APPEND_SYSTEM.md
        target: /home/lyssna/.pi/agent/APPEND_SYSTEM.md
        read_only: true
      # Pup and Secret Service state stays in the container filesystem. The
      # current launcher never recreates a worktree container without cleanup,
      # so a named volume would add no useful durability and must not be shared
      # between independent gnome-keyring daemons.
      - sentry:/home/lyssna/.sentry

volumes:
  pi-agent:
  # Shared package caches, created by hub-workflow.local.sh. Both are content
  # addressed/versioned; worktree node_modules remains isolated by Hub's base
  # Compose configuration.
  pnpm-store:
    external: true
    name: lyssna-pnpm-store
  mise-data:
    external: true
    name: lyssna-mise-data
  sentry:
    external: true
    name: lyssna-sentry
